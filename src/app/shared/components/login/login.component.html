<div class="login-container">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="email">Email</label>
      <input id="email" class="form-control" formControlName="email" type="email" required />
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" class="form-control" formControlName="password" type="password" required />
    </div>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <button type="submit" [disabled]="loginForm.invalid" class="btn btn-dark">Login</button>
  </form>
</div>
