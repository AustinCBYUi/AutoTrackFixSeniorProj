<div class="container mt-4">
  <h2 class="mb-3">Client Management</h2>

  <button class="btn btn-success" routerLink="/add-client">Add New Client</button>

  <!-- Search -->
  <div class="input-group mb-3 mt-3">
    <input
      type="text"
      class="form-control"
      placeholder="Search by name, email, or phone"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()" />
  </div>

  <!-- Table -->
  <table class="table table-striped table-borderless">
    <thead class="thead-dark text-center">
    <tr>
      <th>First</th>
      <th>Last</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let client of paginatedClients">
      <td>{{ client.firstName }}</td>
      <td>{{ client.lastName }}</td>
      <td>{{ client.email }}</td>
      <td>{{ client.phoneNumber }}</td>
      <td>
        <button class="btn btn-primary btn-sm me-2" [routerLink]="[client.id]">
          View
        </button>
        <button class="btn btn-warning btn-sm me-2" (click)="editClient(client)">
          Edit
        </button>
        <button class="btn btn-danger btn-sm" (click)="deleteClient(client.id)">
          Delete
        </button>
      </td>
    </tr>
    </tbody>
  </table>
  <nav class="d-flex justify-content-center align-items-center">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(currentPage - 1)">Previous</button>
      </li>

      <li class="page-item"
          *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1">
        <button class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</button>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="changePage(currentPage + 1)">Next</button>
      </li>

    </ul>
  </nav>
</div>
