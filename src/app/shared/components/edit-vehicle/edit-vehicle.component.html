<h2>Edit Vehicle</h2>

<form (ngSubmit)="onSubmit()" #editVehicleForm="ngForm" *ngIf="vehicle">
  <div class="fun">
    <label for="year" class="visually-hidden">Year:</label>
    <input type="number" id="year" name="year" [(ngModel)]="vehicle.year" class="form-control" placeholder="Year">
  </div>

  <div class="fun">
    <label for="make" class="visually-hidden">Make:</label>
    <input id="make" name="make" [(ngModel)]="vehicle.make" class="form-control" placeholder="Make" required>
  </div>

  <div class="fun">
    <label for="model" class="visually-hidden">Model:</label>
    <input id="model" name="model" [(ngModel)]="vehicle.model" class="form-control" placeholder="Model" required>
  </div>

  <div class="fun">
    <label for="vin" class="visually-hidden">VIN:</label>
    <input id="vin" name="vin" [(ngModel)]="vehicle.vin" class="form-control" placeholder="VIN">
  </div>

  <div class="fun">
    <label for="licensePlate" class="visually-hidden">License Plate:</label>
    <input id="licensePlate" name="licensePlate" [(ngModel)]="vehicle.licensePlate" class="form-control" placeholder="License Plate">
  </div>

  <h3>Vehicle Information</h3>

  <div class="fun">
    <label for="engineSize" class="visually-hidden">Engine Size:</label>
    <input id="engineSize" name="engineSize" [(ngModel)]="vehicle.engineSize" class="form-control" placeholder="Engine Size">
  </div>

  <div class="fun">
    <label for="trim" class="visually-hidden">Trim:</label>
    <input id="trim" name="trim" [(ngModel)]="vehicle.trim" class="form-control" placeholder="Trim">
  </div>

  <div class="fun">
    <label for="color" class="visually-hidden">Color:</label>
    <input id="color" name="color" [(ngModel)]="vehicle.color" class="form-control" placeholder="Color">
  </div>

  <div class="fun">
    <label for="createdDate">Created Date:</label>
    <input type="date" id="createdDate" name="createdDate" [(ngModel)]="vehicle.createdDate" class="form-control">
  </div>

  <div class="fun">
    <label for="lastServiced">Last Serviced Date:</label>
    <input type="date" id="lastServiced" name="lastServiced" [(ngModel)]="vehicle.lastServiced" class="form-control">
  </div>

  <div class="fun">
    <label for="nextServiceDate">Next Service Date:</label>
    <input type="date" id="nextServiceDate" name="nextServiceDate" [(ngModel)]="vehicle.nextServiceDate" class="form-control">
  </div>

  <h3>Vehicle Notes</h3>

  <div class="fun">
    <textarea
      id="vehicleNotes"
      name="vehicleNotes"
      [(ngModel)]="noteText"
      class="form-control"
      placeholder="Add a vehicle note">
    </textarea>

    <button
      type="button"
      class="btn btn-outline-primary"
      (click)="addVehicleNote(noteText)">
      Add Note
    </button>
  </div>

  <ul *ngIf="vehicle.vehicleNotes && vehicle.vehicleNotes.length > 0" class="list-group">
    <li *ngFor="let note of vehicle.vehicleNotes; let i = index" class="list-group-item">
      <p><strong>{{ note.date }}</strong>: {{ note.text }}</p>

      <button
        type="button"
        class="btn btn-outline-danger"
        (click)="removeVehicleNote(i)">
        Remove
      </button>
    </li>
  </ul>

  <p *ngIf="!vehicle.vehicleNotes || vehicle.vehicleNotes.length === 0">
    No vehicle notes available.
  </p>

  <div class="button-group">
    <button type="submit" class="btn btn-primary">Save Vehicle</button>
    <button type="button" class="btn btn-outline-info" (click)="cancel()">Cancel</button>
  </div>
</form>
