<h2>Add New Vehicle</h2>

<form (ngSubmit)="addVehicle()" #addVehicleForm="ngForm">
  <div class="fun">
    <label for="year" class="visually-hidden">Year:</label>
    <input type="number" id="year" name="year" [(ngModel)]="newVehicle.year" class="form-control" placeholder="Year">
  </div>

  <div class="fun">
    <label for="make" class="visually-hidden">Make:</label>
    <input id="make" name="make" [(ngModel)]="newVehicle.make" class="form-control" placeholder="Make" required>
  </div>

  <div class="fun">
    <label for="model" class="visually-hidden">Model:</label>
    <input id="model" name="model" [(ngModel)]="newVehicle.model" class="form-control" placeholder="Model" required>
  </div>

  <div class="fun">
    <label for="vin" class="visually-hidden">VIN:</label>
    <input id="vin" name="vin" [(ngModel)]="newVehicle.vin" class="form-control" placeholder="VIN">
  </div>

  <div class="fun">
    <label for="licensePlate" class="visually-hidden">License Plate:</label>
    <input id="licensePlate" name="licensePlate" [(ngModel)]="newVehicle.licensePlate" class="form-control" placeholder="License Plate">
  </div>

  <h3>Vehicle Information</h3>

  <div class="fun">
    <label for="engineSize" class="visually-hidden">Engine Size:</label>
    <input id="engineSize" name="engineSize" [(ngModel)]="newVehicle.engineSize" class="form-control" placeholder="Engine Size">
  </div>

  <div class="fun">
    <label for="trim" class="visually-hidden">Trim:</label>
    <input id="trim" name="trim" [(ngModel)]="newVehicle.trim" class="form-control" placeholder="Trim">
  </div>

  <div class="fun">
    <label for="color" class="visually-hidden">Color:</label>
    <input id="color" name="color" [(ngModel)]="newVehicle.color" class="form-control" placeholder="Color">
  </div>

  <div class="fun visually-hidden">
    <label for="createdDate">Created Date:</label>
    <input type="date" id="createdDate" name="createdDate" [(ngModel)]="newVehicle.createdDate" class="form-control">
  </div>

  <div class="fun">
    <label for="lastServiced">Last Serviced Date:</label>
    <input type="date" id="lastServiced" name="lastServiced" [(ngModel)]="newVehicle.lastServiced" class="form-control">
  </div>

  <div class="fun">
    <label for="nextServiceDate">Next Service Date:</label>
    <input type="date" id="nextServiceDate" name="nextServiceDate" [(ngModel)]="newVehicle.nextServiceDate" class="form-control">
  </div>

  <h3>Vehicle Notes</h3>

  <div class="fun">
  <textarea
    id="vehicleNotes"
    name="vehicleNotes"
    [(ngModel)]="noteText"
    class="form-control"
    placeholder="Add a vehicle note">
  </textarea>

    <button
      type="button"
      class="btn btn-outline-primary"
      (click)="addVehicleNote(noteText)">
      Add Note
    </button>
  </div>

  <ul *ngIf="newVehicle.vehicleNotes && newVehicle.vehicleNotes.length > 0" class="list-group">
    <li
      *ngFor="let note of newVehicle.vehicleNotes"
      class="list-group-item">

      <strong>{{ note.date }}</strong><br>
      {{ note.text }}

    </li>
  </ul>

  <div class="button-group">
    <button type="submit" class="btn btn-primary">Add Vehicle</button>
    <button type="button" class="btn btn-outline-info" (click)="cancel()">Cancel</button>
  </div>
</form>
