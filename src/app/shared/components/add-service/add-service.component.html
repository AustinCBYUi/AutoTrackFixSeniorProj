<h2>Add New Service</h2>

<form (ngSubmit)="addService()" #addServiceForm="ngForm">
  <div class="fun">
    <label for="serviceTitle" class="visually-hidden">Service Title:</label>
    <input
      id="serviceTitle"
      name="serviceTitle"
      [(ngModel)]="newService.serviceTitle"
      class="form-control"
      placeholder="Service Title"
      required>
  </div>

  <div class="fun">
    <label for="serviceDate">Service Date:</label>
    <input
      type="date"
      id="serviceDate"
      name="serviceDate"
      [(ngModel)]="newService.serviceDate"
      class="form-control"
      required>
  </div>

  <div class="fun">
    <label for="mileage" class="visually-hidden">Mileage:</label>
    <input
      type="number"
      id="mileage"
      name="mileage"
      [(ngModel)]="newService.mileage"
      class="form-control"
      placeholder="Mileage">
  </div>

  <div class="fun">
    <label for="cost" class="visually-hidden">Cost:</label>
    <input
      type="number"
      id="cost"
      name="cost"
      [(ngModel)]="newService.cost"
      class="form-control"
      placeholder="Cost">
  </div>

  <div class="fun">
    <label for="description" class="visually-hidden">Description:</label>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="newService.description"
      class="form-control"
      placeholder="Service Description">
    </textarea>
  </div>

  <div class="fun">
    <label for="nextServiceDate">Next Service Date:</label>
    <input
      type="date"
      id="nextServiceDate"
      name="nextServiceDate"
      [(ngModel)]="newService.nextServiceDate"
      class="form-control">
  </div>

  <div class="fun">
    <label for="status">Status:</label>
    <select
      id="status"
      name="status"
      [(ngModel)]="newService.status"
      class="form-control">

      <option value="Scheduled">Scheduled</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
      <option value="Cancelled">Cancelled</option>
    </select>
  </div>

  <div class="button-group">
    <button type="submit" class="btn btn-primary">Add Service</button>
    <button type="button" class="btn btn-outline-info" (click)="cancel()">Cancel</button>
  </div>
</form>
